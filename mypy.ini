# Mypy configuration — Trinity AI
# Third-party AI libs (langchain*, jose, chromadb) ship without complete stubs,
# so missing imports are ignored. Real type errors are still enforced.
[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = False
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
exclude = (^|/)(\.venv|node_modules|migrations|chromadb_data)/

[mypy-*.migrations.*]
ignore_errors = True

# httpx 0.27's ASGITransport stubs mis-type a Starlette/FastAPI app, producing
# false-positive arg-type errors in every test that builds a client. Suppress
# only that code in test modules.
[mypy-fast_api_services.tests.*]
disable_error_code = arg-type
