name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core_service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest --no-header -q

  fastapi:
    name: FastAPI (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fast_api_services/requirements.txt
      - run: pip install -r fast_api_services/requirements.txt ruff mypy
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy fast_api_services/
      - name: Pytest
        working-directory: fast_api_services
        run: pytest tests/ -q

  frontend:
    name: Frontend (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm test
