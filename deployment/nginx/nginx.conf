worker_processes auto;

events {
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Rate limiting — auth zone 5 req/min per IP
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Docker's embedded DNS resolver — re-resolve every 30s so
    # container IP changes after restart don't cause 502s.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;

        # Variable resolver targets (forces per-request DNS re-resolution)
        set $django_upstream "http://django:8000";
        set $fastapi_upstream "http://fast_api:8001";

        # --- Auth endpoints → Django ---
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass         $django_upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # --- Booking write endpoints → Django ---
        location /api/bookings/create {
            proxy_pass         $django_upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # --- All other /api/* → FastAPI ---
        location /api/ {
            proxy_pass         $fastapi_upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SSE support (agent/chat streaming)
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 120s;
        }

        # --- Django Admin ---
        location /admin/ {
            proxy_pass         $django_upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # --- Django static files (admin CSS/JS) ---
        location /static/ {
            proxy_pass         $django_upstream;
            proxy_set_header   Host $host;
        }

        # --- React SPA → static files ---
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
