# Production compose — single VM + Docker Compose, Let's Encrypt TLS.
#
# Prereqs: DNS A record for $DOMAIN -> this VM; ports 80 and 443 open.
#
# First-time setup:
#   1. cp deployment/.env.prod.example deployment/.env   # fill secrets + DOMAIN
#   2. Issue the first certificate (nginx must be down; certbot binds :80):
#        docker run --rm -p 80:80 \
#          -v trinity_letsencrypt:/etc/letsencrypt \
#          -v trinity_certbot_www:/var/www/certbot \
#          certbot/certbot certonly --standalone \
#          -d "<DOMAIN>" --email "<EMAIL>" --agree-tos --no-eff-email
#   3. docker compose -f deployment/docker-compose.prod.yaml --env-file deployment/.env up -d --build
#   4. One-time catalog seed (only on a fresh DB):
#        docker compose -f deployment/docker-compose.prod.yaml --env-file deployment/.env \
#          exec django python manage.py loaddata fixtures/initial_catalog.json fixtures/initial_centers.json
#
# Renewal: the `certbot` service renews via webroot every 12h. nginx caches certs,
# so add a weekly host cron to pick them up:
#   docker compose -f deployment/docker-compose.prod.yaml exec nginx nginx -s reload
#
# Only nginx publishes host ports. db/redis/django/fast_api are reachable solely
# on the compose network.

name: trinity

services:
  db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  django:
    build:
      context: ../core_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core_service.wsgi:application
               --bind 0.0.0.0:8000
               --workers ${GUNICORN_WORKERS:-3}
               --timeout 60
               --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  fast_api:
    build:
      context: ../fast_api_services
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_SERVICE_URL: http://django:8000
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHROMA_PERSIST_DIR: /app/chromadb_data
      DOCS_DIR: /app/docs
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      # Keep 1 worker while ChromaDB is embedded in-process (indexing in lifespan).
      # >1 is unlocked after RAG indexing is extracted (GĐ4).
      FASTAPI_WORKERS: ${FASTAPI_WORKERS:-1}
    volumes:
      - chroma_data:/app/chromadb_data
      - ../docs:/app/docs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn fast_api_services.main:app
        --host 0.0.0.0 --port 8001
        --workers ${FASTAPI_WORKERS:-1}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  celery:
    build:
      context: ../core_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A core_service worker -l info -Q default --concurrency ${CELERY_CONCURRENCY:-2}

  celery-beat:
    build:
      context: ../core_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A core_service beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      - django
      - fast_api

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - django
      - fast_api
      - frontend

  certbot:
    image: certbot/certbot:latest@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM;
          while :; do
            certbot renew --webroot -w /var/www/certbot --quiet;
            sleep 12h & wait $${!};
          done"

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  frontend_dist:
  letsencrypt:
  certbot_www:
